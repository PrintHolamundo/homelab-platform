---
- name: Deploy Docker Compose services
  hosts: docker_nodes
  become: true
  vars_files:
    - secrets.yml
  vars:
    enabled_services:
      - portainer
      - caddy
      - cloudflared
      - mediacenter
      # - Add more services here as needed

  tasks:
    - name: Ensure service base directories exist
      ansible.builtin.file:
        path: "/opt/services/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ enabled_services }}"

    - name: Copy Compose configuration files for each service
      ansible.builtin.copy:
        src: "services/{{ item }}/docker-compose.yml"
        dest: "/opt/services/{{ item }}/docker-compose.yml"
        mode: '0644'
      loop: "{{ enabled_services }}"

    - name: Check which services have a .env.j2 template locally
      ansible.builtin.stat:
        path: "services/{{ item }}/.env.j2"
      delegate_to: localhost
      become: false
      register: env_templates
      loop: "{{ enabled_services }}"

    - name: Render .env files dynamically for required services
      ansible.builtin.template:
        src: "services/{{ item.item }}/.env.j2"
        dest: "/opt/services/{{ item.item }}/.env"
        mode: '0600'
      loop: "{{ env_templates.results }}"
      when: item.stat.exists
      no_log: true

    - name: Render and deploy Caddyfile template if Caddy is enabled
      ansible.builtin.template:
        src: services/caddy/Caddyfile.j2
        dest: /opt/services/caddy/Caddyfile
        mode: '0644'
      when: "'caddy' in enabled_services"
      notify: Restart Caddy

    - name: Deploy Docker Compose service stacks
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "/opt/services/{{ item }}"
      loop: "{{ enabled_services }}"
      register: compose_output
      changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"

  handlers:
    - name: Restart Caddy
      ansible.builtin.command: docker compose restart caddy
      args:
        chdir: /opt/services/caddy