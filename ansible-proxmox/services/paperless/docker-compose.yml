services:
  paperless-broker:
    image: docker.io/valkey/valkey:8-alpine
    container_name: paperless_broker
    restart: unless-stopped
    volumes:
      - ${PAPERLESS_STORAGE_PATH}/redis:/data
    networks:
      - paperless_net

  paperless-db:
    image: docker.io/library/postgres:16-alpine
    container_name: paperless_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ${PAPERLESS_STORAGE_PATH}/pgdata:/var/lib/postgresql/data
    networks:
      - paperless_net

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION}
    container_name: paperless_webserver
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-broker
    ports:
      - "${PAPERLESS_PORT}:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${DB_NAME}
      PAPERLESS_DBUSER: ${DB_USER}
      PAPERLESS_DBPASS: ${DB_PASS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      USERMAP_UID: ${USERMAP_UID}
      USERMAP_GID: ${USERMAP_GID}
      PAPERLESS_USE_X_FORWARD_PORT: ${PAPERLESS_USE_X_FORWARD_PORT}
      PAPERLESS_USE_X_FORWARD_HOST: ${PAPERLESS_USE_X_FORWARD_HOST}
    volumes:
      - ${PAPERLESS_STORAGE_PATH}/data:/usr/src/paperless/data
      - ${PAPERLESS_STORAGE_PATH}/media:/usr/src/paperless/media
      - ${PAPERLESS_STORAGE_PATH}/export:/usr/src/paperless/export
      - ${PAPERLESS_STORAGE_PATH}/consume:/usr/src/paperless/consume
    networks:
      - paperless_net
      - caddy_net

  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless_ai
    restart: unless-stopped
    depends_on:
      - paperless
    ports:
      - "${PAPERLESS_AI_PORT}:3000"
    environment:
      - PAPERLESS_API_URL=http://paperless:8000/api
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - PAPERLESS_URL=http://paperless:8000
      - PAPERLESS_TOKEN=${PAPERLESS_API_TOKEN}
      - PAPERLESS_USERNAME=${PAPERLESS_USERNAME:-admin}
      - AI_PROVIDER=custom
      - CUSTOM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - CUSTOM_MODEL=${PAPERLESS_AI_MODEL:-gemini-3.5-flash-lite}
      - CUSTOM_API_KEY=${GEMINI_API_KEY}
      - SCAN_INTERVAL=*/2 * * * *
      - ADD_AI_PROCESSED_TAG=no
      - AI_PROCESSED_TAG_NAME=
      - PROCESS_PREVIEWS=true
      - CUSTOM_FIELDS={"custom_fields":[]}
      - PUID=${USERMAP_UID}
      - PGID=${USERMAP_GID}
    volumes:
      - ${PAPERLESS_STORAGE_PATH}/ai:/app/data
      - ${PAPERLESS_STORAGE_PATH}/ai/server.js:/app/server.js:ro
    networks:
      - paperless_net
      - caddy_net

  paperless-assistant:
    build:
      context: ./assistant
      dockerfile: Dockerfile
    image: paperless-assistant:latest
    container_name: paperless_assistant
    restart: unless-stopped
    depends_on:
      - paperless
    ports:
      - "${PAPERLESS_ASSISTANT_PORT:-8050}:8000"
    environment:
      - PAPERLESS_API_URL=http://paperless:8000/api
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - BASE_PAPERLESS_URL=${BASE_PAPERLESS_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${PAPERLESS_ASSISTANT_MODEL:-gemini-3.5-flash-lite}
      - DATA_DIR=/app/data
    volumes:
      - ${PAPERLESS_STORAGE_PATH}/assistant:/app/data
    networks:
      - paperless_net

networks:
  paperless_net:
    driver: bridge
  caddy_net:
    external: true

