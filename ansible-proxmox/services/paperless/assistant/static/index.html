<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paperless AI Assistant</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Safe dynamic viewport height for mobile devices */
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Notch & Safe area handling */
    header {
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.625rem);
    }
    #chat-bottom-bar {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
    }

    /* Markdown prose responsive formatting */
    .prose {
      width: 100%;
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .prose table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-collapse: collapse;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 0.5rem;
    }
    .prose th, .prose td {
      border: 1px solid #334155;
      padding: 0.4rem 0.65rem;
      text-align: left;
      white-space: nowrap;
    }
    @media (min-width: 640px) {
      .prose th, .prose td {
        padding: 0.5rem 0.75rem;
        white-space: normal;
      }
    }
    .prose th {
      background-color: #1e293b;
      color: #f8fafc;
      font-weight: 600;
    }
    .prose tr:nth-child(even) {
      background-color: #0f172a;
    }
    .prose a {
      color: #38bdf8;
      text-decoration: underline;
    }
    .prose a:hover {
      color: #7dd3fc;
    }
    .prose ul {
      list-style-type: disc;
      margin-left: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .prose ol {
      list-style-type: decimal;
      margin-left: 1.25rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .prose code {
      background-color: #1e293b;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.8125rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .prose pre {
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #0f172a;
      padding: 0.65rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      margin: 0.5rem 0;
    }
    .prose pre code {
      background-color: transparent;
      padding: 0;
    }

    /* Custom thin scrollbar */
    #messages-container::-webkit-scrollbar {
      width: 5px;
    }
    #messages-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="h-[100dvh] flex flex-col font-sans antialiased bg-slate-950 text-slate-100">

  <!-- Header: Fully responsive, clean layout without title clipping -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 pb-2.5 sm:pb-3 flex items-center justify-between shrink-0 shadow-sm z-10">
    <!-- Left Brand: Title + Live status -->
    <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-950/50 shrink-0">
        <i data-lucide="file-text" class="w-4 h-4 sm:w-4.5 sm:h-4.5"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-sm sm:text-base md:text-lg text-slate-100 tracking-tight whitespace-nowrap">
          Paperless AI
        </span>
        <span class="text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 whitespace-nowrap">
          Live
        </span>
      </div>
    </div>

    <!-- Right Actions & Desktop Stats -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <!-- Desktop Stats (hidden on mobile/tablet to give full room to title) -->
      <div id="stats-badge-header" class="hidden lg:flex items-center gap-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60 text-slate-300 opacity-0 transition-opacity duration-300">
        <i data-lucide="database" class="w-3.5 h-3.5 text-slate-400"></i>
        <span id="stats-text-header" class="whitespace-nowrap">Cargando...</span>
      </div>

      <!-- Sync Button -->
      <button 
        id="btn-sync" 
        onclick="triggerSync()" 
        title="Sincronizar transacciones de recibos y estados de cuenta" 
        class="flex items-center justify-center gap-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 active:bg-slate-700 text-slate-200 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg border border-slate-700 transition touch-manipulation shadow-sm"
      >
        <i id="sync-icon" data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Sincronizar</span>
      </button>

      <!-- Clear Chat Button -->
      <button 
        onclick="clearChat()" 
        title="Limpiar conversación" 
        class="p-1.5 sm:p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 active:bg-slate-700 rounded-lg transition touch-manipulation"
      >
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Chat Container -->
  <main class="flex-1 flex flex-col max-w-4xl lg:max-w-5xl w-full mx-auto p-2 sm:p-4 overflow-hidden">
    
    <!-- Messages Scroll Area -->
    <div id="messages-container" class="flex-1 overflow-y-auto space-y-3 sm:space-y-4 px-1 sm:px-2 scroll-smooth">

      <!-- Welcome Banner -->
      <div id="welcome-card" class="bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 border border-slate-800 rounded-xl sm:rounded-2xl p-4 sm:p-6 my-2 sm:my-3 shadow-xl">
        <div class="flex items-start gap-3 sm:gap-4">
          <div class="p-2 sm:p-3 bg-emerald-500/10 rounded-lg sm:rounded-xl text-emerald-400 border border-emerald-500/20 shrink-0 mt-0.5">
            <i data-lucide="sparkles" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h2 class="text-base sm:text-lg font-bold text-white tracking-tight">¿En qué puedo ayudarte hoy?</h2>
            <p class="text-xs sm:text-sm text-slate-400 mt-1 leading-relaxed">
              Puedo consultar todo tu archivo en Paperless (pólizas, garantías, manuales, facturas) y responder cálculos financieros exactos de tus estados de cuenta.
            </p>

            <!-- Stats Pill in Welcome Card (Visible on ALL devices) -->
            <div id="welcome-stats" class="mt-3 inline-flex items-center gap-2 text-xs bg-slate-800/80 border border-slate-700/60 rounded-lg px-2.5 py-1.5 text-slate-300 opacity-0 transition-opacity">
              <i data-lucide="database" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
              <span id="welcome-stats-text">Cargando datos del archivo...</span>
            </div>

            <!-- Quick Suggestions (Tablet: 2-cols, Mobile: 1-col) -->
            <div class="mt-3.5 sm:mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button onclick="sendPrompt(this.innerText.trim())" class="text-left text-xs bg-slate-800/80 hover:bg-slate-800 active:bg-slate-700 text-slate-300 hover:text-white p-2.5 sm:p-3 rounded-xl border border-slate-700/60 transition flex items-center gap-2.5 touch-manipulation">
                <i data-lucide="trending-down" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                <span class="leading-snug">¿Cuánto he gastado en total este mes y en qué categorías?</span>
              </button>
              <button onclick="sendPrompt(this.innerText.trim())" class="text-left text-xs bg-slate-800/80 hover:bg-slate-800 active:bg-slate-700 text-slate-300 hover:text-white p-2.5 sm:p-3 rounded-xl border border-slate-700/60 transition flex items-center gap-2.5 touch-manipulation">
                <i data-lucide="receipt" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                <span class="leading-snug">Muestra los 5 gastos más grandes registrados</span>
              </button>
              <button onclick="sendPrompt(this.innerText.trim())" class="text-left text-xs bg-slate-800/80 hover:bg-slate-800 active:bg-slate-700 text-slate-300 hover:text-white p-2.5 sm:p-3 rounded-xl border border-slate-700/60 transition flex items-center gap-2.5 touch-manipulation">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                <span class="leading-snug">¿Hasta cuándo tienen vigencia mis pólizas o garantías?</span>
              </button>
              <button onclick="sendPrompt(this.innerText.trim())" class="text-left text-xs bg-slate-800/80 hover:bg-slate-800 active:bg-slate-700 text-slate-300 hover:text-white p-2.5 sm:p-3 rounded-xl border border-slate-700/60 transition flex items-center gap-2.5 touch-manipulation">
                <i data-lucide="search" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                <span class="leading-snug">¿Cuál fue el último pago de luz o servicios que tengo?</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Input Bar: Safe bottom area for Mobile & Tablet -->
    <div id="chat-bottom-bar" class="mt-2 sm:mt-3 shrink-0">
      <form id="chat-form" onsubmit="handleFormSubmit(event)" class="relative flex items-center">
        <!-- 16px text-base prevents auto-zoom on iOS browsers, scales to text-sm on tablet/desktop -->
        <input 
          id="user-input" 
          type="text" 
          placeholder="Pregunta sobre gastos, facturas o documentos..." 
          autocomplete="off"
          class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 rounded-xl sm:rounded-2xl py-3 sm:py-3.5 pl-3.5 sm:pl-4 pr-14 sm:pr-24 text-base sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 shadow-lg touch-manipulation"
        />
        <button 
          id="btn-send"
          type="submit" 
          aria-label="Enviar mensaje"
          class="absolute right-1.5 sm:right-2 px-3 sm:px-4 py-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-semibold rounded-lg sm:rounded-xl flex items-center gap-1.5 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-emerald-950 touch-manipulation"
        >
          <span class="hidden sm:inline">Enviar</span>
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
        </button>
      </form>
      <div class="flex items-center justify-between px-2 pt-1.5 text-[10px] sm:text-[11px] text-slate-500">
        <span class="truncate">Gemini + Paperless-ngx FTS</span>
        <span id="sync-notification" class="text-emerald-400 font-medium hidden flex items-center gap-1">
          <i data-lucide="loader" class="w-3 h-3 animate-spin"></i>
          Sincronizando...
        </span>
      </div>
    </div>
  </main>

  <script>
    let chatHistory = [];
    const messagesContainer = document.getElementById("messages-container");
    const userInput = document.getElementById("user-input");
    const btnSend = document.getElementById("btn-send");

    async function loadStats() {
      try {
        const res = await fetch("/api/stats");
        if (res.ok) {
          const json = await res.json();
          const d = json.data;
          const formattedVol = Number(d.total_volume).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 2});
          const statsString = `${d.processed_documents} docs · ${d.total_transactions} gastos ($${formattedVol})`;
          
          // Header badge (desktop)
          const badgeHeader = document.getElementById("stats-badge-header");
          const textHeader = document.getElementById("stats-text-header");
          if (badgeHeader && textHeader) {
            textHeader.innerText = statsString;
            badgeHeader.classList.remove("opacity-0");
          }

          // Welcome card badge (mobile & tablet)
          const welcomeStats = document.getElementById("welcome-stats");
          const welcomeText = document.getElementById("welcome-stats-text");
          if (welcomeStats && welcomeText) {
            welcomeText.innerText = statsString;
            welcomeStats.classList.remove("opacity-0");
          }
        }
      } catch (e) {
        console.warn("Could not load stats", e);
      }
    }

    async function triggerSync() {
      const btn = document.getElementById("btn-sync");
      const icon = document.getElementById("sync-icon");
      const notif = document.getElementById("sync-notification");

      icon.classList.add("animate-spin");
      notif.classList.remove("hidden");

      try {
        const res = await fetch("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ limit: 30 })
        });
        const data = await res.json();
        console.log("Sync response:", data);
        
        let checks = 0;
        const interval = setInterval(async () => {
          checks++;
          const statusRes = await fetch("/api/sync/status");
          const statusData = await statusRes.json();
          if (!statusData.is_running || checks > 15) {
            clearInterval(interval);
            icon.classList.remove("animate-spin");
            notif.classList.add("hidden");
            await loadStats();
          }
        }, 2000);

      } catch (e) {
        console.error("Sync error:", e);
        icon.classList.remove("animate-spin");
        notif.classList.add("hidden");
      }
    }

    function appendMessage(role, content, sources = []) {
      const isUser = role === "user";
      const messageDiv = document.createElement("div");
      messageDiv.className = `flex gap-2 sm:gap-3 ${isUser ? "justify-end" : "justify-start"} items-start w-full`;

      const avatar = document.createElement("div");
      avatar.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl flex items-center justify-center shrink-0 text-xs font-semibold ${
        isUser 
          ? "bg-slate-700 text-slate-200" 
          : "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30"
      }`;
      avatar.innerHTML = isUser ? '<i data-lucide="user" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>' : '<i data-lucide="bot" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>';

      const bubble = document.createElement("div");
      bubble.className = `max-w-[88%] sm:max-w-[82%] rounded-2xl px-3.5 py-2.5 sm:px-4 sm:py-3 text-xs sm:text-sm shadow-md overflow-hidden ${
        isUser 
          ? "bg-emerald-600 text-white rounded-br-none" 
          : "bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none prose prose-invert"
      }`;

      if (isUser) {
        bubble.innerText = content;
      } else {
        bubble.innerHTML = marked.parse(content);
        
        // Render document source tags
        if (sources && sources.length > 0) {
          const sourcesDiv = document.createElement("div");
          sourcesDiv.className = "mt-2.5 pt-2.5 border-t border-slate-800 flex flex-wrap gap-1.5 items-center not-prose";
          
          const label = document.createElement("span");
          label.className = "text-[10px] sm:text-[11px] text-slate-500 font-medium mr-1 flex items-center gap-1 shrink-0";
          label.innerHTML = '<i data-lucide="paperclip" class="w-3 h-3"></i> Fuentes:';
          sourcesDiv.appendChild(label);

          sources.forEach(s => {
            const a = document.createElement("a");
            a.href = s.url;
            a.target = "_blank";
            a.className = "inline-flex items-center gap-1 text-[10px] sm:text-[11px] px-2 py-0.5 rounded-md bg-slate-800 text-emerald-400 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 transition max-w-[200px] sm:max-w-[280px] truncate";
            a.innerHTML = `<span class="truncate">${s.title || `Doc #${s.id}`}</span> <i data-lucide="external-link" class="w-2.5 h-2.5 shrink-0"></i>`;
            sourcesDiv.appendChild(a);
          });
          bubble.appendChild(sourcesDiv);
        }
      }

      if (isUser) {
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(avatar);
      } else {
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
      }

      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      lucide.createIcons();
    }

    function sendPrompt(text) {
      userInput.value = text;
      handleFormSubmit(new Event('submit'));
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      const welcome = document.getElementById("welcome-card");
      if (welcome) welcome.classList.add("hidden");

      appendMessage("user", message);
      chatHistory.push({ role: "user", content: message });
      userInput.value = "";
      userInput.disabled = true;
      btnSend.disabled = true;

      const typingIndicator = document.createElement("div");
      typingIndicator.id = "typing-indicator";
      typingIndicator.className = "flex gap-2 sm:gap-3 justify-start items-center text-xs text-slate-400 italic py-2";
      typingIndicator.innerHTML = `
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center shrink-0">
          <i data-lucide="loader" class="w-3.5 h-3.5 sm:w-4 sm:h-4 animate-spin"></i>
        </div>
        <span>Consultando Paperless y calculando...</span>
      `;
      messagesContainer.appendChild(typingIndicator);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      lucide.createIcons();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: message,
            history: chatHistory.slice(-6)
          })
        });

        if (document.getElementById("typing-indicator")) {
          typingIndicator.remove();
        }

        const rawText = await res.text();
        let data = null;
        try {
          data = JSON.parse(rawText);
        } catch (jsonErr) {
          console.warn("Server returned non-JSON response:", rawText);
          appendMessage("assistant", `⚠️ Error del servidor (${res.status}): ${rawText.slice(0, 180) || "Respuesta no válida del servicio"}`);
          return;
        }

        if (!res.ok) {
          const errMsg = (data && (data.detail || data.message || data.error)) || `Error HTTP ${res.status}`;
          appendMessage("assistant", `⚠️ ${errMsg}`);
          return;
        }

        const responseText = data.response || "No se obtuvo respuesta.";
        appendMessage("assistant", responseText, data.sources || []);
        chatHistory.push({ role: "assistant", content: responseText });

      } catch (err) {
        if (document.getElementById("typing-indicator")) {
          typingIndicator.remove();
        }
        console.error("Fetch error:", err);
        appendMessage("assistant", `❌ Error al consultar el asistente: ${err.message || "Fallo de conexión"}`);
      } finally {
        userInput.disabled = false;
        btnSend.disabled = false;
        userInput.focus();
      }
    }

    function clearChat() {
      chatHistory = [];
      messagesContainer.innerHTML = "";
      const welcome = document.getElementById("welcome-card");
      if (welcome) {
        welcome.classList.remove("hidden");
        messagesContainer.appendChild(welcome);
      }
    }

    // Keep scroll aligned when virtual keyboard opens on mobile
    userInput.addEventListener("focus", () => {
      setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 300);
    });

    // Init
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadStats();
    });
  </script>
</body>
</html>
