services:
  dochat:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: dochat:latest
    container_name: dochat
    restart: unless-stopped
    ports:
      - "${DOCHAT_PORT}:8000"
    environment:
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_TOKEN=${PAPERLESS_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - DATABASE_PATH=/data/dochat.db
    volumes:
      - ${CONFIG_DIR}/dochat/data:/data
    networks:
      - paperless_net

networks:
  paperless_net:
    external: true
    name: paperless_paperless_net
